<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizarra de Dibujo</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Canvas principal para dibujo -->
    <canvas id="drawingCanvas"></canvas>

    <!-- Capa para elementos HTML (texto, imágenes) -->
    <div id="elementsLayer"></div>

    <!-- Botón para mostrar/ocultar toolbar -->
    <button id="toggleToolbar" class="toggle-btn">⋯</button>

    <!-- Barra de herramientas flotante -->
    <div id="toolbar" class="toolbar">
        <button id="noneTool" class="tool-btn" data-tool="none" title="Sin acción">⛔</button>
        <button id="pencilTool" class="tool-btn active" data-tool="pencil" title="Lápiz">✏️</button>
        <button id="eraserTool" class="tool-btn" data-tool="eraser" title="Borrador">🧽</button>

        <div class="tool-group">
            <label for="colorPicker" class="tool-btn" title="Color">🎨</label>
            <input type="color" id="colorPicker" value="#ffffff">
        </div>

        <div class="tool-group size-control">
            <label class="tool-label">📏</label>
            <input type="range" id="sizeSlider" min="1" max="150" value="5">
            <input type="number" id="sizeInput" min="1" max="150" value="5">
        </div>

        <button id="textTool" class="tool-btn" data-tool="text" title="Texto">📝</button>

        <div class="tool-group">
            <label for="imageInput" class="tool-btn" title="Imagen">🖼️</label>
            <input type="file" id="imageInput" accept="image/*" style="display: none;">
        </div>

        <button id="clearCanvas" class="tool-btn" title="Limpiar Canvas">🧹</button>
        <button id="resetAll" class="tool-btn" title="Reset Todo">🗑️</button>
    </div>

    <!-- On-screen keyboard -->
    <div id="onScreenKeyboard" class="keyboard hidden" aria-hidden="true">
        <div class="keyboard-header">
            <button id="kbdDragHandle" class="mini-handle" title="Mover">↕</button>
            <div class="keyboard-controls">
                <button id="keyboardClose" class="mini-handle" title="Cerrar">✕</button>
            </div>
        </div>
        <div class="keyboard-rows" id="keyboardRows"></div>
        <div class="keyboard-footer">
            <button id="kbdShift" class="key special">Shift</button>
            <button id="kbdSpace" class="key wide">Espacio</button>
            <button id="kbdEnter" class="key special">Enter</button>
            <button id="kbdBack" class="key special">⌫</button>
        </div>
    </div>

    <div id="confirmModal" class="confirm-modal hidden">
        <div class="confirm-box">
            <p>Confirmar</p>
            <div class="confirm-btn">
                <button id="confirmOk">OK</button>
                <button id="confirmCancel">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
